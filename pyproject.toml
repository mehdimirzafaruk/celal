[project]
name = "celal"
version = "0.2.0"
description = "Celal: Hermes sunucusuna bağlanan yerel Türkçe sesli asistan (Mac penceresi + Whisper MLX + EMA Lightning)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mehdi Mirza Parmaksız", email = "78604694+mehdimirzafaruk@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ema-lightning>=1.1.2",
    "httpx>=0.27",
    "pipecat-ai[mlx-whisper,whisper]>=1.13,<1.14",
    "pywebview>=5.3",
    "rumps>=0.4.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
celal = "celal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
